name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      # O setup-php instala o Composer 2.2 LTS no PHP 5.6–7.1 e a versão atual nas demais.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, json
          coverage: none
          tools: composer

      # Sem composer.lock versionado: cada versão do PHP resolve o PHPUnit compatível (5.7 a 13).
      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Testes
        run: composer test

  compat:
    name: PHPCompatibility e Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer

      # O Rector também analisa tests/ e precisa das classes do PHPUnit.
      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCompatibility (PHP 5.6+)
        run: composer compat

      # Falha se o Rector tiver alguma migração pendente.
      - name: Rector (dry-run)
        run: composer rector
